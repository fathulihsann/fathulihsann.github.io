<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 — fathul@ihsan: ~</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --accent:#FF6500;--accent-2:#ff8c42;
    --green:#3fb950;--red:#ff5f56;--yellow:#ffbd2e;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Space Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
    --body:"Inter",system-ui,sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  [data-theme="dark"]{
    --bg:#020203;--surface:#111113;--nav-bg:#131315;--nav-bg-2:#1c1c1f;
    --ink:#e9eef7;--muted:#9a9a9f;--border:rgba(255,255,255,.09);
  }
  [data-theme="light"]{
    --bg:#f5f7fa;--surface:#ffffff;--nav-bg:#ffffff;--nav-bg-2:#eef0f3;
    --ink:#0B192C;--muted:#666b72;--border:rgba(11,25,44,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;width:100%}

  nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:150;
    width:min(1000px,calc(100% - 32px))}
  .cap{border-radius:999px;background:color-mix(in srgb,var(--nav-bg) 85%,transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 34px rgba(0,0,0,.28);border:1px solid var(--border)}
  .term-bar{display:flex;align-items:center;gap:14px;padding:16px 24px}
  .dots{display:flex;gap:8px}
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.r{background:var(--red)}.dot.y{background:var(--yellow)}.dot.g{background:var(--green)}
  .term-title{font-family:var(--mono);font-size:13px;color:var(--muted);flex:1}
  .term-title b{color:var(--ink)}
  .theme-btn{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;
    display:grid;place-items:center;padding:0;transition:.25s}
  .theme-btn:hover{color:var(--accent);transform:rotate(15deg)}
  .theme-btn svg{width:18px;height:18px}

  main{flex:1;display:flex;align-items:center;padding-top:90px}
  .content{width:100%}
  .prompt{font-family:var(--mono);color:var(--accent);font-size:14px;margin-bottom:22px}
  .prompt::before{content:"$ ";color:var(--muted)}
  h1{font-family:var(--sans);font-weight:700;letter-spacing:-.03em;line-height:.95;
    font-size:clamp(72px,16vw,180px);color:var(--accent)}
  .msg{font-family:var(--mono);font-size:clamp(15px,2.2vw,18px);color:var(--muted);margin-top:18px;max-width:56ch}
  .msg .err{color:#ff8a80}
  .cursor{display:inline-block;width:.55ch;height:1em;background:var(--accent);
    vertical-align:-.15em;animation:blink 1s steps(1) infinite;margin-left:4px}
  @keyframes blink{50%{opacity:0}}
  .cta{display:flex;gap:14px;margin-top:38px;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:14px;padding:13px 22px;border-radius:9px;cursor:pointer;
    border:1px solid var(--border);transition:.25s;display:inline-block}
  .btn.primary{background:var(--accent);color:#0B192C;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{background:var(--accent-2)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  footer{padding:26px 0;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);
    border-top:1px solid var(--border)}
</style>
</head>
<body>
  <nav>
    <div class="cap">
      <div class="term-bar">
        <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
        <div class="term-title"><b>fathul@ihsan</b>: ~</div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <div class="content">
      <div class="prompt">curl -I https://fathulihsann.github.io<span id="path"></span></div>
      <h1>404</h1>
      <p class="msg"><span class="err">HTTP/1.1 404 Not Found</span><br/>
        Halaman yang antum cari nggak ketemu di server ini — mungkin salah ketik URL, atau linknya sudah nggak ada.<span class="cursor"></span></p>
      <div class="cta">
        <a class="btn primary" href="/">cd ~ &amp; kembali ke home</a>
        <a class="btn ghost" href="/#work">lihat karya</a>
        <a class="btn ghost" href="/#contact">hubungi saya</a>
      </div>
    </div>
  </main>

  <footer>connection refused. © <span id="yr"></span> Fathul Ihsan</footer>

<script>
  document.getElementById('yr').textContent=new Date().getFullYear();
  document.getElementById('path').textContent=location.pathname;

  const root=document.documentElement, themeIcon=document.getElementById('themeIcon');
  const SUN='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>';
  const MOON='<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>';
  function setTheme(t){root.setAttribute('data-theme',t);themeIcon.innerHTML=t==='dark'?SUN:MOON;localStorage.setItem('theme',t);}
  function toggleTheme(){setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');}
  setTheme(localStorage.getItem('theme')|| (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
</script>
</body>
</html>
